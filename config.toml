[server]
hostname = "localhost"

[server.listener.smtp]
bind = ["0.0.0.0:25"]
tls.implicit = false

[server.listener.submission]
bind = ["0.0.0.0:587"]
tls.implicit = false

[server.listener.submissions]
bind = ["0.0.0.0:465"]
tls.implicit = true

[server.listener.imap]
bind = ["0.0.0.0:143"]
tls.implicit = false

[server.listener.imaps]
bind = ["0.0.0.0:993"]
tls.implicit = true

[server.listener.pop3]
bind = ["0.0.0.0:110"]
tls.implicit = false

[server.listener.pop3s]
bind = ["0.0.0.0:995"]
tls.implicit = true

[server.listener.managesieve]
bind = ["0.0.0.0:4190"]
tls.implicit = false

[server.listener.http]
bind = ["0.0.0.0:8080"]
tls.implicit = false

[server.listener.https]
bind = ["0.0.0.0:443"]
tls.implicit = true

[storage]
data = "rocksdb"
blob = "rocksdb"
full-text = "rocksdb"
lookup = "rocksdb"

[store.rocksdb]
path = "/var/lib/stalwart/data"

[queue]
type = "rocksdb"
path = "/var/lib/stalwart/queue"

[directory]
type = "internal"

[authentication]
type = "internal"
