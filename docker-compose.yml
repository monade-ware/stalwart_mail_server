

services:
  stalwart:
    build:
      context: .
    container_name: stalwart-mail
    restart: unless-stopped

    ports:
      - "443:443"      # HTTPS / WebAdmin
      - "25:25"        # SMTP
      - "110:110"      # POP3
      - "587:587"      # SMTP Submission
      - "465:465"      # SMTPS
      - "143:143"      # IMAP
      - "993:993"      # IMAPS
      - "995:995"      # POP3S
      - "4190:4190"    # ManageSieve
      - "8080:8080"    # HTTP API / Health

    volumes:
      - ./config.toml:/etc/stalwart/config.toml
      - stalwart-data:/var/lib/stalwart

    environment:
      - STALWART_RECOVERY_ADMIN=${STALWART_RECOVERY_ADMIN}
      - STALWART_RECOVERY_MODE=${STALWART_RECOVERY_MODE}

    # Override default command (which looks for config.json) to use config.toml
    command: ["--config", "/etc/stalwart/config.toml"]

volumes:
  stalwart-data:
    name: stalwart-data
