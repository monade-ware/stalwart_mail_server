
services:
  stalwart:
    build:
      context: .
    container_name: stalwart
    restart: unless-stopped
    networks:
      - stalwart-network
    environment:
      # Set your recovery password here directly for the initial setup
      - STALWART_RECOVERY_ADMIN=${STALWART_RECOVERY_ADMIN}
    ports:
      - "25:25"     # SMTP
      - "465:465"   # SMTPS
      - "587:587"   # Submission
      - "143:143"   # IMAP
      - "993:993"   # IMAPS
      - "110:110"   # POP3
      - "995:995"   # POP3S
      - "443:443"   # HTTPS / Web Interface
      - "8080:8080" # HTTP / Management / Setup
      - "4190:4190"    # ManageSieve
    volumes:
      # Map the ENTIRE stalwart directory to persist config, DB, and certificates
      - ./stalwart-data:/opt/stalwart-mail
    # Use the correct internal path for the configuration file
    command: ["--config", "/opt/stalwart-mail/etc/config.toml"]

networks:
  stalwart-network:
    driver: bridge

